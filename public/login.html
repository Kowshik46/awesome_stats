<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Stats login</title>
<style>:root{--bg:#0a0a0f;--card:#13131c;--line:#24243a;--tx:#e8e8f0;--mu:#9a9ab3;--ac:#6366f1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px Inter,system-ui,sans-serif}
form{width:min(360px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{margin:0 0 6px;font-size:20px}p{margin:0 0 18px;color:var(--mu);font-size:14px}
input,button{width:100%;padding:12px 14px;border-radius:10px;font:inherit;border:1px solid var(--line)}
input{background:#0a0a0f;color:var(--tx);margin-bottom:12px}button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
.e{color:#f87171;font-size:14px;margin-bottom:10px;display:none}.show{display:block}</style></head><body>
<form method="post" action="/login"><h1>Site stats</h1><p>Admin only.</p><div class="e" id="e">Wrong password.</div>
<input type="password" name="password" placeholder="Password" autofocus required><button>Sign in</button></form>
<script>if(location.search.includes('e=1'))document.getElementById('e').classList.add('show')</script></body></html>
