<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Certs</title>
<style>
:root{--bg:#0a0a0f;--card:#13131c;--line:#24243a;--tx:#e8e8f0;--mu:#9a9ab3;--ac:#6366f1;--ac2:#818cf8;--pk:#f472b6;--gr:#34d399}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px}h1 small{display:block;color:var(--mu);font-size:13px;font-weight:400}
.ctl{display:flex;gap:6px;flex-wrap:wrap}.ctl a,.ctl input{background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;text-decoration:none}
.ctl input{color:var(--tx);min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bars div{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bars i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--pk))}.bars em{font-style:normal;color:var(--mu);text-align:right}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mu);font-weight:600}td.n{font-weight:600}td.s{color:var(--gr);font-weight:700}td.m{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px}#err{color:#f87171;display:none}
@media(max-width:560px){.bars div{grid-template-columns:110px 1fr 34px}}
</style></head><body><div class="w">
<header><h1>Certificates<small id="sum">Loading…</small></h1><div class="ctl"><input id="q" placeholder="Search name or ID" aria-label="Search"><a href="/">Dashboard</a><a href="/visits">Visits table</a><a href="/reports">Reports</a><a href="/logout">Log out</a></div></header>
<p id="err">Could not load certificates. Check the Render logs.</p>
<div class="kpis" id="kpis"></div>
<div class="card"><h2>Titles earned</h2><div class="bars" id="titles"></div></div>
<div class="card"><h2>Where they came from</h2><div class="bars" id="src"></div></div>
<div class="card"><h2>All certificates</h2><div class="tw"><table><thead><tr><th>When (IST)</th><th>Name</th><th>Score</th><th>Title</th><th>Stages</th><th>Source</th><th>Country</th><th>Browser</th><th>ID</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><script src="/session.js"></script><script>
let idleAt=Date.now();['click','keydown','touchstart','mousemove'].forEach(e=>addEventListener(e,()=>idleAt=Date.now(),{passive:true}));
setInterval(()=>{if(Date.now()-idleAt>15*60e3)location.href='/logout'},30e3);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const srcOf=r=>r.utm_source?(r.utm_source+(r.utm_campaign?' / '+r.utm_campaign:'')):r.referrer?(()=>{try{return new URL(r.referrer).hostname}catch{return 'referrer'}})():'direct';
let rows=[];
function bars(el,counts){const e=Object.entries(counts).sort((a,b)=>b[1]-a[1]),m=Math.max(1,...e.map(x=>x[1]));
 el.innerHTML=e.length?e.map(([k,v])=>`<div><span>${esc(k)}</span><i style="width:${Math.max(4,v/m*100)}%"></i><em>${v}</em></div>`).join(''):'<div class="empty">None yet.</div>'}
function draw(){
 const q=$('q').value.trim().toLowerCase(),l=rows.filter(r=>!q||String(r.name).toLowerCase().includes(q)||String(r.cert_id).toLowerCase().includes(q));
 const today=new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);
 const avg=rows.length?(rows.reduce((a,r)=>a+r.score/r.total,0)/rows.length*100).toFixed(0)+'%':'–';
 const perfect=rows.filter(r=>r.score===r.total).length,li=rows.filter(r=>r.utm_source==='linkedin').length;
 $('sum').textContent=rows.length+' certificates';
 $('kpis').innerHTML=[[rows.length,'certificates'],[rows.filter(r=>String(r.created_at_ist).startsWith(today)).length,'today (IST)'],[avg,'average score'],[perfect,'perfect scores'],[li,'came from LinkedIn']].map(([v,t])=>`<div class="k"><b>${v}</b><span>${t}</span></div>`).join('');
 const t={},s={};rows.forEach(r=>{t[r.title||'?']=(t[r.title||'?']||0)+1;const k=srcOf(r);s[k]=(s[k]||0)+1});bars($('titles'),t);bars($('src'),s);
 $('rows').innerHTML=l.length?l.map(r=>`<tr><td class="m">${esc(String(r.created_at_ist).replace('T',' ').slice(0,16))}</td><td class="n">${esc(r.name)}</td><td class="s">${r.score}/${r.total}</td><td>${esc(r.title)}</td><td class="m">${r.stages?Object.entries(r.stages).map(([k,v])=>esc(k)+' '+esc(v)).join(' · '):''}</td><td>${esc(srcOf(r))}</td><td>${esc(r.country)}</td><td class="m">${esc(r.browser)}</td><td class="m">${esc(r.cert_id)}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">No certificates yet.</td></tr>'}
async function load(){try{const r=await fetch('/api/certs');if(r.status===401)return location.href='/login';rows=await r.json();$('err').style.display='none';draw()}catch(e){$('err').style.display='block'}}
$('q').addEventListener('input',draw);load();
</script></body></html>
