<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reports</title>
<style>
:root{--bg:#0a0a0f;--card:#13131c;--line:#24243a;--tx:#e8e8f0;--mu:#9a9ab3;--ac:#6366f1;--ac2:#818cf8;--pk:#f472b6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px}h1 small{display:block;color:var(--mu);font-size:13px;font-weight:400}
.ctl{display:flex;gap:6px;flex-wrap:wrap}.ctl button,.ctl a{background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.ctl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.r{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mu);font-size:12px;margin-bottom:8px}.meta b{color:var(--ac2)}
.r h3{margin:10px 0 2px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}.r p{margin:0;white-space:pre-wrap;word-break:break-word}
.st{display:flex;gap:6px;margin-top:12px}.st button{background:none;color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}.st button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:30px}#err{color:#f87171;display:none}
</style></head><body><div class="w">
<header><h1>Reports<small id="sum">Loading…</small></h1><div class="ctl" id="f"><button data-s="new" class="on">New</button><button data-s="fixed">Fixed</button><button data-s="wontfix">Won't fix</button><button data-s="">All</button><a href="/">Dashboard</a><a href="/certs">Certs</a><a href="/logout">Log out</a></div></header>
<p id="err">Could not load reports. Check the Render logs.</p><div id="list"></div>
</div><script>
let idleAt=Date.now();['click','keydown','touchstart','mousemove'].forEach(e=>addEventListener(e,()=>idleAt=Date.now(),{passive:true}));
setInterval(()=>{if(Date.now()-idleAt>15*60e3)location.href='/logout'},30e3);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=[],flt='new';
function draw(){const l=rows.filter(r=>!flt||r.status===flt);
 $('sum').textContent=rows.filter(r=>r.status==='new').length+' new, '+rows.length+' total';
 $('list').innerHTML=l.length?l.map(r=>`<div class="r"><div class="meta"><span>#${r.id}</span><span>${esc(String(r.created_at_ist).replace('T',' ').slice(0,16))} IST</span><b>${esc(r.path)}</b><span>${esc(r.browser)}</span>${r.version?`<span>${esc(r.version)}</span>`:''}${r.email?`<span>${esc(r.email)}</span>`:''}</div><h3>What broke</h3><p>${esc(r.what_broke)}</p>${r.expected?`<h3>Expected</h3><p>${esc(r.expected)}</p>`:''}<div class="st">${['new','fixed','wontfix'].map(s=>`<button data-id="${r.id}" data-s="${s}" class="${r.status===s?'on':''}">${s==='wontfix'?"won't fix":s}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Nothing here.</div>'}
async function load(){try{const r=await fetch('/api/reports');if(r.status===401)return location.href='/login';rows=await r.json();$('err').style.display='none';draw()}catch(e){$('err').style.display='block'}}
$('f').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.s;[...$('f').querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));draw()});
$('list').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;
 const r=await fetch('/api/reports/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(b.dataset.id),status:b.dataset.s})});
 if(r.ok){rows.find(x=>x.id==b.dataset.id).status=b.dataset.s;draw()}});
load();
</script></body></html>
