<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Visits</title>
<style>
:root{--bg:#0a0a0f;--card:#13131c;--line:#24243a;--tx:#e8e8f0;--mu:#9a9ab3;--ac:#6366f1;--ac2:#818cf8;--pk:#f472b6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px}h1 small{display:block;color:var(--mu);font-size:13px;font-weight:400}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl button,.ctl a,select,input{background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.ctl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}input{cursor:text;color:var(--tx);min-width:200px}select{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
th{color:var(--mu);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}th:hover{color:var(--tx)}
tbody tr:hover{background:#181826}.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px}
.new{background:#34d39922;color:#34d399}.ret{background:#818cf822;color:var(--ac2)}.vid{font-family:ui-monospace,monospace;color:var(--pk)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0;color:var(--mu);font-size:13px;flex-wrap:wrap;gap:8px}
@media(max-width:700px){.w{padding:14px 12px 40px}h1{font-size:19px}
.ctl input,.ctl select{flex:1 1 45%;min-width:0;width:100%}.ctl input{flex-basis:100%}
.card{border:0;background:none;padding:0;overflow:visible}table,thead,tbody,tr,td{display:block;white-space:normal}thead{display:none}
tbody tr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}td::before{content:attr(data-l);color:var(--mu);text-align:left;flex:none}
td:empty{display:none}tbody tr:hover{background:var(--card)}}
.empty{padding:24px;color:var(--mu);text-align:center}
</style></head><body><div class="w">
<header><h1>Visits<small id="sum">Loading…</small></h1>
<div class="ctl" id="range"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button><button data-d="365">1y</button><a href="/">Dashboard</a><a href="/logout">Log out</a></div></header>
<div class="ctl" style="margin-bottom:12px"><input id="q" placeholder="Search anything…" type="search">
<select id="fc"></select><select id="fp"></select><select id="fs"></select><select id="fd"></select>
<select id="fr"><option value="">New + returning</option><option value="new">New only</option><option value="ret">Returning only</option></select>
<button id="csv">Export CSV</button><button id="clr">Clear</button></div>
<div class="card"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table><div id="em" class="empty" style="display:none">No visits match.</div></div>
<div class="bar"><span id="cnt"></span><span class="ctl"><button id="prev">Prev</button><span id="pg"></span><button id="next">Next</button></span></div>
</div><script>
// Auto-lock after 15 minutes without interaction.
let idleAt=Date.now();['click','keydown','touchstart','mousemove'].forEach(e=>addEventListener(e,()=>idleAt=Date.now(),{passive:true}));
setInterval(()=>{if(Date.now()-idleAt>15*60e3)location.href='/logout'},30e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-idleAt>15*60e3)location.href='/logout'});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=[['t','When (IST)'],['vid','Visitor'],['visit','Visit #'],['country','Country'],['path','Page'],['src','Source'],['camp','Campaign'],['device','Device'],['browser','Browser'],['lang','Lang']];
let all=[],sort={k:'t',dir:-1},page=0,days=30;const PER=50;
const F={c:'country',p:'path',s:'src',d:'device'};
function opts(id,label,key){const vals=[...new Set(all.map(r=>r[key]).filter(Boolean))].sort();const cur=$(id).value;$(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('');$(id).value=vals.includes(cur)?cur:''}
function filtered(){const q=$('q').value.trim().toLowerCase(),fc=$('fc').value,fp=$('fp').value,fs=$('fs').value,fd=$('fd').value,fr=$('fr').value;
 let r=all.filter(x=>(!fc||x.country===fc)&&(!fp||x.path===fp)&&(!fs||x.src===fs)&&(!fd||x.device===fd)&&(!fr||(fr==='new'?x.visit===1:x.visit>1))&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));
 const k=sort.k;r.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sort.dir});return r}
function render(){const r=filtered(),pages=Math.max(1,Math.ceil(r.length/PER));page=Math.min(page,pages-1);
 $('hd').innerHTML=COLS.map(([k,l])=>`<th data-k="${k}">${l}${sort.k===k?(sort.dir>0?' ▲':' ▼'):''}</th>`).join('');
 $('tb').innerHTML=r.slice(page*PER,page*PER+PER).map(x=>`<tr><td data-l="When (IST)">${esc(x.t.replace('T',' '))}</td><td data-l="Visitor"><span class="vid">${esc(x.vid)}</span> <span class="tag ${x.visit===1?'new':'ret'}">${x.visit===1?'new':'returning'}</span></td><td data-l="Visit #">${x.visit}</td><td data-l="Country">${esc(x.country)}</td><td data-l="Page">${esc(x.path)}</td><td data-l="Source">${esc(x.src)}</td><td data-l="Campaign">${esc(x.camp)}</td><td data-l="Device">${esc(x.device)}</td><td data-l="Browser">${esc(x.browser)}</td><td data-l="Lang">${esc(x.lang)}</td></tr>`).join('');
 $('em').style.display=r.length?'none':'block';$('cnt').textContent=`${r.length} of ${all.length} visits`;$('pg').textContent=`Page ${page+1} / ${pages}`;$('prev').disabled=page<=0;$('next').disabled=page>=pages-1}
async function load(){const res=await fetch('/api/visits?days='+days);if(res.status===401)return location.href='/login';const d=await res.json();all=d.rows;
 $('sum').textContent=`Last ${d.days} days · ${new Set(all.map(r=>r.vid)).size} visitors · ${all.length} visits · visitor IDs are short hashes, not names`;
 opts('fc','All countries','country');opts('fp','All pages','path');opts('fs','All sources','src');opts('fd','All devices','device');page=0;render()}
$('hd').addEventListener('click',e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;sort=sort.k===k?{k,dir:-sort.dir}:{k,dir:k==='t'?-1:1};render()});
['q','fc','fp','fs','fd','fr'].forEach(i=>$(i).addEventListener('input',()=>{page=0;render()}));
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
$('clr').onclick=()=>{['q','fc','fp','fs','fd','fr'].forEach(i=>$(i).value='');page=0;render()};
$('csv').onclick=()=>{const r=filtered(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv=[COLS.map(c=>q(c[1])).join(','),...r.map(x=>COLS.map(([k])=>q(x[k])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='visits.csv';a.click()};
$('range').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;days=+b.dataset.d;document.querySelectorAll('#range button').forEach(x=>x.classList.toggle('on',x===b));load()});
load();
</script><script src="/session.js"></script></body></html>
